name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish container image
    runs-on: ubuntu-latest
    # The `secrets` context is not available to `if:` conditions -- only to
    # `with:` and `run:`. Lifting them into the job environment first is what
    # makes "publish to Docker Hub only when it is configured" expressible at
    # all; referring to secrets.* in a condition is a workflow parse error,
    # not a false condition, so the whole file is rejected.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: without the secrets the release still goes to
      # GHCR alone, so a fork or a clone of this workflow does not fail on a
      # registry it has no account for.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Decide which registries to publish to
        id: registries
        run: |
          images="ghcr.io/camwise1/prudify"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            images="$images"$'\n'"docker.io/$DOCKERHUB_USERNAME/prudify"
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # `is_default_branch` compares the ref against the default branch
            # name, and on a tag push the ref is "refs/tags/vX.Y.Z" -- so it is
            # always false and `latest` was never published, while every doc
            # told people to pull it. A v* tag IS the release; tag it latest,
            # excluding prereleases (v1.0.0-rc1 contains a hyphen).
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
