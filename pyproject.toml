[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prudify"
version = "0.1.0"
description = "Self-hosted profanity filtering for audiobook libraries, with a web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prudify contributors" }]
keywords = ["audiobook", "profanity", "whisper", "audiobookshelf", "plex", "m4b"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "watchdog>=4.0",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# The transcription backend is optional so the server can be installed and
# explored (and CI can run) without pulling ~1 GB of ML wheels.
whisper = ["faster-whisper>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
prudify = "prudify.cli:app"

[project.urls]
Homepage = "https://github.com/YOURNAME/prudify"
Issues = "https://github.com/YOURNAME/prudify/issues"

[tool.hatch.build.targets.wheel]
packages = ["backend/prudify"]

# The built UI and the bundled wordlists are data files, not Python modules.
# Listing them explicitly means they are packaged even when the build runs
# somewhere without VCS metadata -- notably inside the Docker image, where
# .git is excluded from the build context. Without this, `pip install .`
# can silently produce a wheel with no web UI in it, and the server then
# answers 404 for every page while looking otherwise healthy.
artifacts = [
    "backend/prudify/static/**/*",
    "backend/prudify/wordlists/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
