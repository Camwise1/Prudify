services:
  prudify:
    # Docker Hub by default: it needs no login, and `docker pull` works the
    # same everywhere. GHCR carries the identical image if you prefer it --
    # note the namespace differs there (camwise1, not camwise).
    image: ${PRUDIFY_IMAGE:-camwise/prudify:latest}
    # Build from this checkout when the image is not already present locally.
    # Remove this line once you are pulling a published image and would rather
    # a missing tag be an error than a silent 20-minute rebuild.
    build: .
    container_name: prudify
    restart: unless-stopped
    # A running job needs time to stop cleanly; the default 10s guarantees a
    # SIGKILL mid-render.
    stop_grace_period: 60s
    # Without this the json-file driver keeps every line the container has
    # ever written, on the Docker data root, forever. Transcription is
    # chatty -- one progress line per chunk per book -- and the log outgrows
    # the library it describes.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8317:8317"
    environment:
      # Prudify sizes its own transcription threads from the cores it can
      # actually see, including a container CPU limit -- which os.cpu_count()
      # ignores. Use `cpus:` under deploy.resources to cap it.
      #
      # OMP_NUM_THREADS is deliberately absent: CTranslate2 reads it only when
      # intra_threads is 0, and Prudify always passes an explicit count, so it
      # never governed transcription despite being documented here as the
      # speed knob. It still affects the VAD and numpy.
      # OMP_NUM_THREADS: 4
      TZ: ${TZ:-Etc/UTC}
      # Match your media share's owner so Plex/Audiobookshelf can manage the
      # cleaned files, not just read them.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      # Scratch renders are multi-gigabyte. Keep them off the config bind
      # mount and on a native volume.
      PRUDIFY_WORK_DIR: /work
      # Uncomment on NFS/SMB mounts where inotify events never arrive. Prudify
      # also falls back on its scheduled rescan, so this is belt and braces.
      # PRUDIFY_POLLING_WATCHER: "1"
    volumes:
      # Config, database, logs, transcripts and downloaded models.
      - ./config:/config
      - work:/work
      # Your existing library. Read-only: Prudify never writes here, and the
      # flag makes that guarantee enforceable rather than merely promised.
      - /path/to/audiobooks:/audiobooks:ro
      # Where cleaned copies are written. Point a second Audiobookshelf
      # library at this folder.
      - /path/to/audiobooks-clean:/audiobooks-clean

  # GPU acceleration is NOT supported by this image. It is built on
  # python:3.11-slim with no CUDA runtime, cuBLAS or cuDNN, and the
  # CTranslate2 wheels do not bundle them -- selecting "cuda" in Settings
  # fails at model load, part-way into a job. A CUDA variant needs a separate
  # image, and is not built yet. Transcription is CPU-only for now.

volumes:
  work:
